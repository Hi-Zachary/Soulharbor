<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>登录 - SoulHarbor</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-emerald-50 text-slate-800 font-sans min-h-screen flex flex-col justify-center">
    <div class="max-w-md mx-auto px-4 py-12 w-full">
      <div class="text-center">
        <div class="text-3xl font-bold text-teal-700">SoulHarbor</div>
        <div class="text-sm text-slate-500 mt-2">随时倾听，温暖陪伴。登录后开始对话。</div>
      </div>

      <div class="mt-8 rounded-2xl border border-white bg-white/80 backdrop-blur shadow-xl shadow-teal-100/50 p-6">
        <div id="err" class="hidden text-sm text-rose-500 bg-rose-50 p-3 rounded-lg mb-4 border border-rose-100"></div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">用户名</label>
            <input id="username" class="w-full rounded-xl bg-gray-50 border border-gray-200 px-4 py-2.5 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all" placeholder="输入用户名" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">密码</label>
            <input id="password" type="password" class="w-full rounded-xl bg-gray-50 border border-gray-200 px-4 py-2.5 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 transition-all" placeholder="输入密码" />
          </div>
          <button id="btn" class="w-full mt-2 px-4 py-3 rounded-xl bg-teal-500 hover:bg-teal-600 text-white font-medium shadow-md shadow-teal-500/30 transition-all transform hover:-translate-y-0.5">登 录</button>
        </div>
        <div class="mt-6 text-center text-sm text-slate-500">
          没有账号？<a class="text-teal-600 hover:text-teal-700 font-medium ml-1 underline underline-offset-2" href="/register">立即注册</a>
        </div>
      </div>
    </div>

    <script>
      const err = document.getElementById("err");
      document.getElementById("btn").addEventListener("click", async () => {
        err.classList.add("hidden");
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const r = await fetch("/api/login", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({username, password}),
        });
        const j = await r.json();
        if (!j.ok) {
          err.textContent = "登录失败：" + (j.error || "unknown");
          err.classList.remove("hidden");
          return;
        }
        window.location.href = "/app";
      });
    </script>
  </body>
</html>
