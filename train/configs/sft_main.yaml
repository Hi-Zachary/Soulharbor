### SoulHarbor 主指令 SFT — Qwen3-14B QLoRA
### 对应脚本: train/scripts/llamafactory/run/run_sft.sh → train_sft_qwen14b_qlora.sh
### 数据: soulharbor_mixed_campus_sft（见 dataset_info.json）
### 落盘产物: archive/weights/lora/sft_main2_20260421_101255（接 sft_20260420_083101 再训 1 epoch）
### 用法: MODEL_NAME_OR_PATH=models/Qwen3-14B bash train/scripts/llamafactory/run/run_sft.sh
###       或 llamafactory-cli train train/configs/sft_main.yaml

### model
model_name_or_path: models/Qwen3-14B
# adapter_name_or_path: archive/weights/lora/sft_20260420_083101   # 复现 sft_main2 时取消注释

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
quantization_bit: 4

### dataset
dataset: soulharbor_mixed_campus_sft
dataset_dir: train/data/llm
template: qwen3_nothink
enable_thinking: false
cutoff_len: 2048
preprocessing_num_workers: 4
overwrite_cache: true
val_size: 0.02

### output
output_dir: saves/qwen14b/lora/sft
overwrite_output_dir: true
logging_steps: 10
save_steps: 1000
save_strategy: steps
plot_loss: true

### eval
do_eval: true
eval_strategy: steps
eval_steps: 1000
per_device_eval_batch_size: 1
load_best_model_at_end: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_steps: 20
fp16: true
flash_attn: sdpa
gradient_checkpointing: true
seed: 42
