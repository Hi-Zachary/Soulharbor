### SoulHarbor PT (continued pretraining) — Qwen3-14B QLoRA
### 对应脚本: train/scripts/llamafactory/run/run_pt.sh → train_pt_qwen14b_qlora.sh
### 落盘产物: archive/weights/lora/pt_20260419_071947
### 用法: cd 仓库根 && llamafactory-cli train train/configs/pt.yaml
###       或 MODEL_NAME_OR_PATH=models/Qwen3-14B bash train/scripts/llamafactory/run/run_pt.sh

### model
model_name_or_path: models/Qwen3-14B

### method
stage: pt
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
quantization_bit: 4

### dataset
dataset: soulharbor_pt
dataset_dir: train/data/llm
template: qwen3_nothink
enable_thinking: false
cutoff_len: 1024
preprocessing_num_workers: 4
overwrite_cache: true

### output
output_dir: saves/qwen14b/lora/pt
overwrite_output_dir: true
logging_steps: 10
save_steps: 200
plot_loss: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 20
fp16: true
flash_attn: sdpa
gradient_checkpointing: true
seed: 42
